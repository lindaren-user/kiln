# Build and deploy kiln when main moves.
# Setup, secrets, and restart commands: deploy/kiln/README.md

name: Kiln

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 要回退或重新部署的镜像标签，例如 abc1234。留空则构建当前提交。
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kiln-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event_name == 'push' || github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

  frontend:
    name: Frontend typecheck and test
    if: github.event_name == 'push' || github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  image:
    name: Publish image
    needs: [backend, frontend]
    if: needs.backend.result == 'success' && needs.frontend.result == 'success' && vars.KILN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Image name
        id: version
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          sha="$(git rev-parse --short=12 HEAD)"
          image="ghcr.io/${owner}/kiln:${sha}"
          printf '%s\n' "${sha}" > VERSION
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${image}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    name: Deploy
    needs: [backend, frontend, image]
    if: >-
      vars.KILN_ENABLED == 'true' &&
      always() &&
      needs.backend.result != 'failure' &&
      needs.frontend.result != 'failure' &&
      needs.image.result != 'failure' &&
      needs.image.result != 'cancelled' &&
      (needs.image.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Copy files and deploy
        env:
          SSH_KEY: ${{ secrets.KILN_SSH_KEY }}
          HOST: ${{ secrets.KILN_HOST }}
          PORT: ${{ secrets.KILN_SSH_PORT }}
          USER: ${{ secrets.KILN_USER }}
          GHCR_USER: ${{ secrets.KILN_GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.KILN_GHCR_TOKEN }}
          BUILT_IMAGE: ${{ needs.image.outputs.image }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ -z "${HOST}" || -z "${USER}" || -z "${SSH_KEY}" ]]; then
            echo "Set KILN_HOST, KILN_USER, and KILN_SSH_KEY to deploy. The image job can still publish without them."
            exit 0
          fi
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="${BUILT_IMAGE}"
          if [[ -n "${INPUT_TAG}" ]]; then
            case "${INPUT_TAG}" in
              */*) image="${INPUT_TAG}" ;;
              *) image="ghcr.io/${owner}/kiln:${INPUT_TAG}" ;;
            esac
          fi
          if [[ -z "${image}" ]]; then
            echo "no image selected" >&2
            exit 1
          fi
          echo "Deploying ${image}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/kiln_deploy
          chmod 600 ~/.ssh/kiln_deploy
          port="${PORT:-22}"
          ssh_opts=(-i "${HOME}/.ssh/kiln_deploy" -p "${port}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_opts[@]}" "${USER}@${HOST}" "mkdir -p /opt/kiln"
          tar -C deploy/kiln -cf - docker-compose.yml nginx.conf.template remote-deploy.sh init-certs.sh .env.example \
            | ssh "${ssh_opts[@]}" "${USER}@${HOST}" "tar -C /opt/kiln -xf -"
          remote="KILN_IMAGE=$(printf '%q' "${image}") KILN_GHCR_USER=$(printf '%q' "${GHCR_USER}") KILN_GHCR_TOKEN=$(printf '%q' "${GHCR_TOKEN}") bash /opt/kiln/remote-deploy.sh"
          ssh "${ssh_opts[@]}" "${USER}@${HOST}" "${remote}"
